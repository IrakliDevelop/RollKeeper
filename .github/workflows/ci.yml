name: CI

on:
  push:
    branches: [master, feature/scenes-table]
  pull_request:
    branches: [master, feature/scenes-table]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format ratchet
        run: npm run format:ci

      - name: Lint warning ratchet
        run: npm run lint:ci

      - name: Type check
        run: npm run type-check

      - name: CI tooling tests
        run: npm run test:ci-tools

      - name: Unit tests
        run: npm run test

      - name: Automatic character sync coverage contract
        run: npm run test:slice9:coverage

      - name: DM workspace identity coverage contract
        run: npm run test:slice10a1:coverage

      - name: Campaign membership cutover coverage contract
        run: npm run test:slice10b:coverage

      - name: IndexedDB migration coverage contract
        run: >-
          npm test -- src/lib/indexeddb src/lib/playerBackup
          --coverage.enabled=true
          --coverage.provider=v8
          --coverage.reporter=text
          --coverage.include='src/lib/indexeddb/*.ts'
          --coverage.thresholds.perFile=true
          --coverage.thresholds.statements=90
          --coverage.thresholds.functions=90
          --coverage.thresholds.branches=85

      - name: Player backup wizard coverage contract
        run: npm run test:player-backup-wizard:coverage

      - name: Durable family coverage contracts
        run: |
          npm run test:slice10a2:coverage
          npm run test:slice11a:coverage
          npm run test:slice11b:coverage
          npm run test:slice11c:coverage
          npm run test:slice11d:coverage
          npm run test:slice11e:coverage
          npm run test:slice11f:coverage
          npm run test:slice11g:coverage

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    # The S3 utility validates these at module evaluation during `next build`.
    # CI never contacts AWS, so use inert values instead of production secrets.
    env:
      AWS_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ci-build-placeholder
      AWS_SECRET_ACCESS_KEY: ci-build-placeholder
      AWS_S3_BUCKET_NAME: ci-build-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

  storybook:
    name: Storybook interaction and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - run: npm run test:visual

  relay:
    name: Relay type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - run: npm ci --prefix relay

      - run: npm run type-check --prefix relay

      - run: npm test --prefix relay

      - run: npm run build --prefix relay

  redis-suites:
    name: Relay and Table control Redis suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json

      - run: npm ci

      - run: npm ci --prefix relay

      # Fenced authority, fog CAS and transport suites (no skips: the script
      # fails when REDIS_TEST_URL is missing).
      - name: Relay Redis suites
        env:
          REDIS_TEST_URL: redis://localhost:6379
        run: npm run test:relay:redis

      # Table control Lua against real Redis and serverless-redis-http; the
      # suite starts its own disposable containers with the runner's Docker.
      - name: Table control Redis suite
        # Report this suite even when the relay step fails (review R2).
        if: ${{ !cancelled() }}
        run: npm run test:table-control:redis

  local-supabase:
    name: Local Supabase database suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start clean local Supabase stack
        run: npm run db:start >/dev/null

      - name: Reset and replay migrations from zero
        run: npm run db:reset

      - name: Lint SQL schema
        run: npm run db:lint

      - name: Run pgTAP tests
        run: npm run db:test

      - name: Run JWT-scoped database integration tests
        run: npm run test:db:integration

      - name: Run membership cutover concurrency integration tests
        run: npm run test:membership:integration

      - name: Run membership session-cookie and CSRF integration tests
        run: npm run test:membership:http

      - name: Verify deterministic reset and replay
        run: npm run test:db:replay

      - name: Verify generated database types
        run: npm run db:types:check

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  integration:
    name: Chromium integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # playwright.config.ts starts the dev server itself (webServer) and
      # refuses to reuse a stale one on CI (reuseExistingServer: !CI).
      # The e2e specs are relay/Redis-free — no service env needed.
      - name: E2E tests
        run: npm run test:e2e

      - name: IndexedDB migration durability tests
        run: npm run test:indexeddb:e2e

      - name: Automatic character sync gating tests
        run: npm run test:automatic-sync:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  auth-integration:
    name: Local OTP and Chromium auth tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start local Supabase Auth and Mailpit
        run: npm run db:start >/dev/null

      - name: Test local OTP lifecycle
        run: npm run test:auth:integration

      - name: Test auth shell in Chromium
        run: npm run test:auth:e2e

      - name: Upload auth Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-playwright-failure-artifacts
          path: |
            playwright-report/auth/
            test-results/auth/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
